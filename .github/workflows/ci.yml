name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }} quality and package integrity
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Python preflight
        run: bash scripts/preflight.sh

  container:
    name: Container build and smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build image
        run: docker build --no-cache --progress=plain -t secscan:ci .

      - name: Verify CLI startup
        run: docker run --rm secscan:ci --version

      - name: Export image for scanning
        run: docker save secscan:ci --output /tmp/secscan-ci.tar

      - name: Scan secscan image
        run: |
          mkdir -p /tmp/trivy-cache
          docker run --rm \
            -v /tmp/secscan-ci.tar:/scan/secscan-ci.tar:ro \
            -v /tmp/trivy-cache:/root/.cache/ \
            aquasec/trivy:0.72.0 image \
            --input /scan/secscan-ci.tar \
            --exit-code 1 \
            --ignore-unfixed \
            --severity CRITICAL
