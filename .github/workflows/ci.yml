name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }} quality and package integrity
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Python preflight
        run: bash scripts/preflight.sh

  container:
    name: Container build and smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image with reusable cache
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          provenance: false
          tags: secscan:ci
          cache-from: type=gha,scope=secscan-ci
          cache-to: type=gha,mode=max,scope=secscan-ci

      - name: Verify CLI startup
        run: docker run --rm secscan:ci --version

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Verify Docker Compose service startup
        run: |
          docker tag secscan:ci secscan:local
          docker compose up --no-build --detach --wait
          curl --fail --silent http://127.0.0.1:8000/healthz
          curl --fail --silent http://127.0.0.1:8000/login | grep --fixed-strings --quiet 'Sign in'

      - name: Verify authenticated Linux host fixture
        run: |
          docker compose --profile linux-host-test up --build --detach --wait linux-host-fixture
          SECSCAN_SSH_USER=secscan-audit \
          SECSCAN_SSH_KEY=/run/secscan-ssh-fixture/client_key \
          SECSCAN_SSH_KNOWN_HOSTS=/run/secscan-ssh-fixture/known_hosts \
          SECSCAN_SSH_PORT=22 \
          docker compose --profile tools --profile linux-host-test run --rm --no-deps cli \
            scan linux-host linux-host-fixture \
            --output-dir /reports/linux-host-fixture \
            --fail-on NONE

      - name: Show Linux host fixture logs on failure
        if: failure()
        run: |
          docker compose --profile linux-host-test ps -a linux-host-fixture || true
          docker compose --profile linux-host-test logs --no-color linux-host-fixture || true

      - name: Stop Docker Compose service
        if: always()
        run: docker compose --profile linux-host-test down -v

      - name: Export image for scanning
        run: docker save secscan:ci --output /tmp/secscan-ci.tar

      - name: Scan secscan image
        run: |
          mkdir -p /tmp/trivy-cache
          docker run --rm \
            -v /tmp/secscan-ci.tar:/scan/secscan-ci.tar:ro \
            -v /tmp/trivy-cache:/root/.cache/ \
            aquasec/trivy:0.74.0 image \
            --input /scan/secscan-ci.tar \
            --scanners vuln \
            --skip-version-check \
            --exit-code 1 \
            --ignore-unfixed \
            --severity CRITICAL
