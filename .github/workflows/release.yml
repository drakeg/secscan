name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish release artifacts
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ghcr.io/${{ github.repository }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Verify tag matches project version
        run: python scripts/release_artifacts.py verify-tag "$GITHUB_REF_NAME" pyproject.toml

      - name: Generate source SBOM
        uses: anchore/sbom-action@v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: /tmp/secscan-source.spdx.json
          syft-version: v1.42.3
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Run repository preflight
        run: bash scripts/preflight.sh

      - name: Build release artifacts
        run: python -m build --sdist --wheel --outdir release-dist

      - name: Verify release wheel
        run: python scripts/verify_wheel.py release-dist/secscan-*.whl

      - name: Stage source SBOM
        run: mv /tmp/secscan-source.spdx.json release-dist/secscan-source.spdx.json

      - name: Generate SHA-256 checksums
        run: python scripts/release_artifacts.py checksums release-dist/SHA256SUMS release-dist/secscan-*.whl release-dist/secscan-*.tar.gz release-dist/secscan-source.spdx.json

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate container metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}

      - name: Build and publish container image
        id: container
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            SECSCAN_VERSION=${{ steps.metadata.outputs.version }}

      - name: Record immutable container reference
        env:
          CONTAINER_DIGEST: ${{ steps.container.outputs.digest }}
        run: printf '%s@%s\n' "$IMAGE_NAME" "$CONTAINER_DIGEST" > release-dist/CONTAINER_IMAGE

      - name: Attest container build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.container.outputs.digest }}
          push-to-registry: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-dist/* --verify-tag --generate-notes --title "secscan $GITHUB_REF_NAME"
