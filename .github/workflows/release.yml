name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Verify tag matches project version
        run: python scripts/release_artifacts.py verify-tag "$GITHUB_REF_NAME" pyproject.toml

      - name: Run repository preflight
        run: bash scripts/preflight.sh

      - name: Build release artifacts
        run: python -m build --sdist --wheel --outdir release-dist

      - name: Verify release wheel
        run: python scripts/verify_wheel.py release-dist/secscan-*.whl

      - name: Generate SHA-256 checksums
        run: python scripts/release_artifacts.py checksums release-dist/SHA256SUMS release-dist/secscan-*.whl release-dist/secscan-*.tar.gz

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-dist/* --verify-tag --generate-notes --title "secscan $GITHUB_REF_NAME"
