name: ${SECSCAN_COMPOSE_PROJECT:-secscan}

x-secscan-volumes: &secscan-volumes
  - secscan-reports:/reports
  - secscan-cache:/cache
  - ${SECSCAN_WORKSPACE:-.}:/workspace:ro

services:
  service:
    build:
      context: .
    image: ${SECSCAN_IMAGE:-secscan:local}
    entrypoint: ["secscan-service"]
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "${SECSCAN_WORKERS:-2}"
      - --job-root
      - /reports/jobs
      - --allowed-input-root
      - /workspace
    ports:
      - "${SECSCAN_BIND_ADDRESS:-127.0.0.1}:${SECSCAN_PORT:-8000}:8000"
    environment:
      SECSCAN_API_TOKEN: "${SECSCAN_API_TOKEN:-}"
      SECSCAN_REGISTRATION_ENABLED: "${SECSCAN_REGISTRATION_ENABLED:-true}"
      SECSCAN_SESSION_COOKIE_SECURE: "${SECSCAN_SESSION_COOKIE_SECURE:-false}"
      SECSCAN_GITHUB_TOKEN: "${SECSCAN_GITHUB_TOKEN:-}"
      SECSCAN_CREDENTIAL_KEY: "${SECSCAN_CREDENTIAL_KEY:-}"
      SECSCAN_SSH_USER: "${SECSCAN_SSH_USER:-}"
      SECSCAN_SSH_KEY: "${SECSCAN_SSH_KEY:-/run/secscan-ssh/id_ed25519}"
      SECSCAN_SSH_KNOWN_HOSTS: "${SECSCAN_SSH_KNOWN_HOSTS:-/run/secscan-ssh/known_hosts}"
      SECSCAN_SSH_PORT: "${SECSCAN_SSH_PORT:-22}"
    volumes:
      - secscan-reports:/reports
      - secscan-cache:/cache
      - ${SECSCAN_WORKSPACE:-.}:/workspace:ro
      - ${SECSCAN_SSH_DIR:-./.secscan-ssh}:/run/secscan-ssh:ro
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)) == {'status': 'ok'}"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  cli:
    profiles: ["tools"]
    build:
      context: .
    image: ${SECSCAN_IMAGE:-secscan:local}
    entrypoint: ["secscan"]
    environment:
      SECSCAN_GITHUB_TOKEN: "${SECSCAN_GITHUB_TOKEN:-}"
      SECSCAN_SSH_USER: "${SECSCAN_SSH_USER:-}"
      SECSCAN_SSH_KEY: "${SECSCAN_SSH_KEY:-/run/secscan-ssh/id_ed25519}"
      SECSCAN_SSH_KNOWN_HOSTS: "${SECSCAN_SSH_KNOWN_HOSTS:-/run/secscan-ssh/known_hosts}"
      SECSCAN_SSH_PORT: "${SECSCAN_SSH_PORT:-22}"
    volumes:
      - secscan-reports:/reports
      - secscan-cache:/cache
      - ${SECSCAN_WORKSPACE:-.}:/workspace:ro
      - ${SECSCAN_SSH_DIR:-./.secscan-ssh}:/run/secscan-ssh:ro
      - secscan-ssh-fixture:/run/secscan-ssh-fixture:ro
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  network-fixture:
    profiles: ["network-test"]
    build:
      context: .
    image: secscan:local
    entrypoint: ["python", "-m", "http.server"]
    command: ["8080", "--bind", "0.0.0.0", "--directory", "/tmp"]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8080', timeout=2).status == 200"
      interval: 2s
      timeout: 2s
      retries: 10

  linux-host-fixture:
    profiles: ["linux-host-test"]
    build:
      context: tests/fixtures/linux-host
    image: secscan-linux-host-fixture:local
    volumes:
      - secscan-ssh-fixture:/fixture
    tmpfs:
      - /run:size=16m,mode=755
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
      - SYS_CHROOT
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "test -s /fixture/client_key && test -s /fixture/known_hosts && pgrep -x sshd >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  secscan-reports:
  secscan-cache:
  secscan-ssh-fixture:
